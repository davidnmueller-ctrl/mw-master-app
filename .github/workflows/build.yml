name: Build

# Push to main: tests + installers as workflow artifacts.
# Tag vX.Y.Z:   tests + installers published as a GitHub release (with
#               latest.json for the in-app updater once signing is set up,
#               see CLAUDE.md "Releases").

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
        env:
          TZ: Europe/Berlin
      - run: cargo test -p mwmaster-core

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - id: create
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `MW Master ${context.ref.replace('refs/tags/', '')}`,
              body: 'Windows: Setup-Datei (.exe) für ARM64 oder x64. macOS: .dmg (Apple Silicon und Intel). Anleitung zur ersten Installation: siehe README.',
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: [test, create-release]
    # create-release is skipped on plain pushes; build anyway.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-arm64
            os: windows-latest
            rust_targets: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
          - name: windows-x64
            os: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis
          - name: macos-universal
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.name }}
      - run: npm ci

      - name: Build (and upload to the release on tags)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional public client configuration. Without it, online reviews
          # stay disabled in the built desktop app.
          VITE_REVIEWS_API_BASE_URL: ${{ vars.VITE_REVIEWS_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.VITE_GOOGLE_DESKTOP_CLIENT_ID }}
          VITE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_DESKTOP_CLIENT_SECRET }}
          # Only needed once the updater is enabled (createUpdaterArtifacts: true).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }} ${{ !startsWith(github.ref, 'refs/tags/v') && '--config src-tauri/tauri.preview.conf.json' || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: MW-Master-${{ matrix.name }}
          path: |
            target/*/release/bundle/nsis/*.exe
            target/*/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
            });
